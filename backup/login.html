<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Water Innovation</title>

<style>
:root{
    --bg:#081c34;
    --card:#0f2a4d;
    --accent:#ffd60a;
    --text:#fff;
}

body{
    margin:0;
    font-family:Segoe UI;
    background:var(--bg);
    color:var(--text);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* LOGIN CARD */
.login-box{
    background:var(--card);
    padding:30px;
    border-radius:12px;
    width:100%;
    max-width:350px;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
    text-align:center;
}

/* LOGO */
.logo{
    height:60px;
    margin-bottom:10px;
}

/* TITLE */
.title{
    color:var(--accent);
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
}

/* INPUT */
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:none;
    outline:none;
    font-size:14px;
}

/* BUTTON */
.btn{
    width:100%;
    padding:12px;
    background:var(--accent);
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

/* ERROR */
.error{
    color:red;
    font-size:13px;
    margin-top:5px;
}

/* FOOTER */
.footer{
    margin-top:15px;
    font-size:12px;
    color:#aaa;
}

/* RESPONSIVE */
@media(max-width:500px){
    .login-box{
        margin:10px;
    }
}
</style>
</head>

<body>

<div class="login-box">

    <img src="logo/logo_white.png" class="logo">

    <div class="title">Admin Login</div>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button class="btn" onclick="login()">Login</button>

    <div class="error" id="error"></div>

    <div class="footer">Water Innovation Systems</div>

</div>

<script>

/* AUTO REDIRECT IF ALREADY LOGGED IN */
if(localStorage.getItem("isLoggedIn") === "true"){
    window.location.href = "dashboard.html";
}

/* LOGIN FUNCTION (ENCODED BASIC SECURITY) */
function login(){

    let user = btoa(document.getElementById("username").value.trim());
    let pass = btoa(document.getElementById("password").value.trim());

    // Encoded Credentials (koshy / Koshy@123)
    let adminUser = "a29zaHk=";
    let adminPass = "S29zaHlAMTIz";

    if(user === adminUser && pass === adminPass){

        localStorage.setItem("isLoggedIn", "true");
        window.location.href = "dashboard.html";

    } else {
        document.getElementById("error").innerText = "Invalid Username or Password";
    }
}

</script>

</body>
</html>
