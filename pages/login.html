<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Water Innovation</title>

<style>
:root{
    --bg:#081c34;
    --card:#0f2a4d;
    --accent:#ffd60a;
    --text:#fff;
}

body{
    margin:0;
    font-family:Segoe UI;
    background:var(--bg);
    color:var(--text);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:var(--card);
    padding:30px;
    border-radius:14px;
    width:100%;
    max-width:350px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.logo{ height:60px; }

.title{
    color:var(--accent);
    font-size:22px;
    margin:15px 0;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:none;
}

button{
    width:100%;
    padding:12px;
    background:var(--accent);
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.switch{
    margin-top:10px;
    font-size:13px;
    cursor:pointer;
    color:#ccc;
}

.error{
    margin-top:10px;
    font-size:13px;
}
</style>

</head>

<body>

<div class="box">
<img src="logo/logo_white.png" class="logo">

<div class="title" id="title">Login</div>

<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">

<button onclick="submitForm()">Login</button>

<div class="switch" onclick="toggleMode()" id="switchText">
Don't have account? Signup
</div>

<div class="error" id="error"></div>
</div>

<script>
let isLogin = true;

/* AUTO LOGIN */
if(localStorage.getItem("auth") === "true"){
    window.location.href = "dashboard.html";
}

function toggleMode(){
    isLogin = !isLogin;

    document.getElementById("title").innerText = isLogin ? "Login" : "Signup";
    document.querySelector("button").innerText = isLogin ? "Login" : "Signup";
    document.getElementById("switchText").innerText =
        isLogin ? "Don't have account? Signup" : "Already have account? Login";
}

/* MAIN */
function submitForm(){
    let user = username.value.trim();
    let pass = password.value.trim();

    if(!user || !pass){
        return showError("Fill all fields");
    }

    let users = JSON.parse(localStorage.getItem("users") || "[]");

    if(isLogin){
        let found = users.find(u => u.user === btoa(user) && u.pass === btoa(pass));

        if(found){
            localStorage.setItem("auth","true");
            location.href = "dashboard.html";
        } else showError("Invalid credentials");
    } else {
        if(users.length >= 2) return showError("Only 2 users allowed");

        if(users.find(u => u.user === btoa(user))){
            return showError("User exists");
        }

        users.push({user:btoa(user), pass:btoa(pass)});
        localStorage.setItem("users", JSON.stringify(users));

        showError("Signup success! Login now","lightgreen");
        toggleMode();
    }
}

function showError(msg,color="red"){
    let e = document.getElementById("error");
    e.style.color = color;
    e.innerText = msg;
}
</script>

</body>
</html>
